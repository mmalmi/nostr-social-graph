[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/mmalmi/nostr-social-graph"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
hashtree-core = { version = "0.2.56", path = "../../hashtree/rust/crates/hashtree-core" }
hashtree-fs = { version = "0.2.56", path = "../../hashtree/rust/crates/hashtree-fs" }
heed = "0.20"
hex = "0.4"
http-body-util = "0.1"
indexmap = "2.12"
nostr = { version = "0.44.3", features = ["nip44"] }
nostr-sdk = "0.44.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.50", features = ["full"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
