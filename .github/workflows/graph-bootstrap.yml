name: Bundled graph bootstrap

on:
  workflow_dispatch:
  push:
    branches: [master, codex/graph-sdk-404]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GRAPH_GATE_EVIDENCE: ${{ runner.temp }}/graph-bootstrap-evidence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install frozen dependencies before network isolation
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Pull the qualified browser image before network isolation
        run: docker pull mcr.microsoft.com/playwright@sha256:cf0daee9b994042e011bc29f20cdff1a9f682a039b43fcd738f7d8a9d3bcd9d6
      - name: Build production package with Node 22.23.4 behind the OS boundary
        run: python3 .github/scripts/graph-gates/host.py build
      - name: Prove browser isolation then run all four page and IIFE checks
        run: python3 .github/scripts/graph-gates/container.py
      - name: Preserve gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-bootstrap-${{ github.sha }}
          path: ${{ env.GRAPH_GATE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 7
