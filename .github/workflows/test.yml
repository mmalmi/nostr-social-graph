name: Test

on:
  workflow_dispatch:
  push:
    branches: [master, codex/graph-sdk-404]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set task-owned evidence directory
        run: echo "GRAPH_GATE_EVIDENCE=$RUNNER_TEMP/graph-test-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install frozen dependencies before network isolation
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare exact Rust toolchain and locked sources before isolation
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 fetch --locked --manifest-path rust/Cargo.toml
      - name: Run all TypeScript and graph persistence tests behind the OS boundary
        run: python3 .github/scripts/graph-gates/host.py tests
      - name: Preserve gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-tests-${{ github.sha }}
          path: ${{ env.GRAPH_GATE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 7
