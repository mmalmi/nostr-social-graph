name: Graph and profile memory measurement
on:
  workflow_dispatch:
  push:
    branches: [codex/graph-profile-memory-replicate]
permissions:
  contents: read
concurrency:
  group: graph-server-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  profile-memory-replicate:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 76
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5cd34a0eafc991186d194f23a72f667702e106a7
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pinned Node and Hashtree tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 harness/fixtures/graph-server-recovery/controller.py bootstrap
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.28.2
          run_install: false
      - name: Qualify exact executable in isolated runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 harness/fixtures/graph-server-recovery/profile_memory_job.py
      - name: Preserve runtime measurements and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: profile-memory-replicate-${{ github.sha }}
          path: ${{ runner.temp }}/graph-server-alias-repair/evidence/profile-memory-aggregate
          if-no-files-found: error
          retention-days: 14
