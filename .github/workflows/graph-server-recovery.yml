name: Graph server bounded recovery qualification
on:
  workflow_dispatch:
  push:
    branches: [codex/graph-memory-full-control]
permissions:
  contents: read
concurrency:
  group: graph-server-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        mode: [candidate, paired-capped]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 83ca2e2a57e145193e0ee7d2273fa5c70457694d
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pinned Node and Hashtree tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 harness/fixtures/graph-server-recovery/controller.py bootstrap
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.28.2
          run_install: false
      - name: Verify source, graph inputs and isolated process memory
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 harness/fixtures/graph-server-recovery/memory_job.py full ${{ matrix.mode }}
      - name: Preserve measured gates and failure samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graph-memory-full-${{ matrix.mode }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/graph-server-alias-repair/evidence/memory
            ${{ runner.temp }}/graph-server-alias-repair/evidence/memory-host.json
          if-no-files-found: warn
          retention-days: 14
