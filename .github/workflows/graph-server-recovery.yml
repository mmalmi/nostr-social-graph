name: Graph server bounded recovery qualification
on:
  workflow_dispatch:
  push:
    branches: [codex/graph-server-recovery]
permissions:
  contents: read
concurrency:
  group: graph-server-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 83ca2e2a57e145193e0ee7d2273fa5c70457694d
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pinned Node and Hashtree tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 harness/fixtures/graph-server-recovery/controller.py bootstrap
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.28.2
          run_install: false
      - name: Build once and qualify without external test traffic
        run: python3 harness/fixtures/graph-server-recovery/controller.py qualify
      - name: Preserve both binaries and qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graph-server-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/graph-server-alias-repair/evidence
          if-no-files-found: error
          retention-days: 14

  baseline-smoke:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 83ca2e2a57e145193e0ee7d2273fa5c70457694d
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pinned Node and Hashtree tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 harness/fixtures/graph-server-recovery/controller.py bootstrap
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.28.2
          run_install: false
      - name: Verify source, graph inputs and isolated process memory
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 harness/fixtures/graph-server-recovery/memory_job.py mobile smoke
      - name: Preserve measured gates and failure samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graph-memory-smoke-mobile-${{ github.sha }}
          path: |
            ${{ runner.temp }}/graph-server-alias-repair/evidence/memory
            ${{ runner.temp }}/graph-server-alias-repair/evidence/memory-host.json
          if-no-files-found: warn
          retention-days: 14

  paired:
    needs: qualify
    strategy:
      fail-fast: false
      matrix:
        tier: [mobile, full]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 83ca2e2a57e145193e0ee7d2273fa5c70457694d
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pinned Node and Hashtree tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 harness/fixtures/graph-server-recovery/controller.py bootstrap
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.28.2
          run_install: false
      - name: Verify source, graph inputs and isolated process memory
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 harness/fixtures/graph-server-recovery/memory_job.py ${{ matrix.tier }} paired
      - name: Preserve measured gates and failure samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graph-memory-paired-${{ matrix.tier }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/graph-server-alias-repair/evidence/memory
            ${{ runner.temp }}/graph-server-alias-repair/evidence/memory-host.json
          if-no-files-found: warn
          retention-days: 14
