name: Daily graph reconciliation qualification
on:
  workflow_dispatch:
  push:
    branches: [codex/graph-daily-crawl-qualification]
permissions:
  contents: read
concurrency:
  group: graph-server-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired-daily:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 57f6ba33c8c962f3fc19a40eb85d27af8d270b8c
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pinned Node and Hashtree tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 harness/fixtures/graph-server-recovery/controller.py bootstrap
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.28.2
          run_install: false
      - name: Qualify exact executables in an isolated runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 harness/fixtures/graph-server-recovery/runtime_job.py paired-daily
      - name: Preserve runtime and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graph-daily-paired-daily-${{ github.sha }}
          path: |
            ${{ runner.temp }}/graph-server-alias-repair/evidence/profile-paired-daily
            ${{ runner.temp }}/graph-server-alias-repair/evidence/profile-host.json
          if-no-files-found: error
          retention-days: 14
  full-daily:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 57f6ba33c8c962f3fc19a40eb85d27af8d270b8c
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pinned Node and Hashtree tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 harness/fixtures/graph-server-recovery/controller.py bootstrap
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.28.2
          run_install: false
      - name: Qualify exact executables in an isolated runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 harness/fixtures/graph-server-recovery/runtime_job.py full-daily
      - name: Preserve runtime and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graph-daily-full-daily-${{ github.sha }}
          path: |
            ${{ runner.temp }}/graph-server-alias-repair/evidence/profile-full-daily
            ${{ runner.temp }}/graph-server-alias-repair/evidence/profile-host.json
          if-no-files-found: error
          retention-days: 14
